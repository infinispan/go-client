name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Create tag
        run: |
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25.x'

      - name: Install asciidoctor
        run: sudo gem install asciidoctor --no-document

      - name: Build documentation archive
        run: make docs-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ inputs.tag }}
          files: docs.zip
          generate_release_notes: true

      - name: Notify website
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.API_TOKEN_GITHUB }}
          repository: infinispan/infinispan.github.io
          event-type: release_updated
          client-payload: '{"project": "go-client"}'
