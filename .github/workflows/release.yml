name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Create tag
        run: |
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.25.x'

      - name: Install asciidoctor
        run: sudo gem install asciidoctor --no-document

      - name: Build documentation archive
        run: make docs-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag }}
          files: docs.zip
          generate_release_notes: true

      - name: Notify website
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.API_TOKEN_GITHUB }}
          repository: infinispan/infinispan.github.io
          event-type: release_updated
          client-payload: '{"project": "go-client"}'
