version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - gocritic
    - misspell
    - revive
    - unconvert
    - govet
    - staticcheck
  settings:
    errcheck:
      check-type-assertions: false
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - text: "Error return value of .*Close.* is not checked"
        linters:
          - errcheck
    paths:
      - vendor

formatters:
  enable:
    - gofmt
